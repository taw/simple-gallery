<!DOCTYPE html>
<html>

<head>

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            overscroll-behavior: none;
        }

        /* -------------------------
           GRID
        ------------------------- */

        #grid {
            position: fixed;
            left: 0;
            right: 0;
            top: var(--top-inset, env(safe-area-inset-top, 0px));
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-auto-rows: calc((100vw - 4px) / 3);
            gap: 2px;
            background: #000;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;

            /* Space for the Android navigation bar. Set from Kotlin via
               setBottomInset(), or picked up from env() if available. */
            padding-bottom: var(--bottom-inset, env(safe-area-inset-bottom, 0px));
        }

        .tile {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #111;
        }

        .tile img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #111;
        }

        .video-marker {
            position: absolute;
            right: 7px;
            bottom: 7px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .video-marker::after {
            content: "";
            margin-left: 2px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 9px solid white;
        }

        /* -------------------------
           VIEWER (TikTok-style pager)
        ------------------------- */

        #viewer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            overflow: hidden;
            z-index: 100;
            touch-action: none;
        }

        #viewer.visible {
            display: block;
        }

        /* Three stacked panes: previous, current, next */
        #track {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            will-change: transform;
        }

        .pane {
            width: 100%;
            height: 100vh;      /* overwritten in JS with the real viewer height */
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pane {
            position: relative;
        }

        .pane img,
        .pane video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Video sits on top of the thumbnail and stays invisible
           until its first frame is actually on screen. */
        .pane video {
            position: absolute;
            left: 0;
            top: 0;
            background: transparent;
        }

        /* Make sure no native play button / overlay ever shows */
        video::-webkit-media-controls,
        video::-webkit-media-controls-start-playback-button,
        video::-webkit-media-controls-overlay-play-button {
            display: none !important;
            -webkit-appearance: none;
        }

    </style>

</head>


<body>

<div id="grid"></div>

<div id="viewer">
    <div id="track"></div>
</div>


<script>

    let media = [];
    let current = 0;
    let gridScroll = 0;

    const grid = document.getElementById("grid");
    const viewer = document.getElementById("viewer");
    const track = document.getElementById("track");


    /* -------------------------
       GRID
    ------------------------- */

    function loadMedia() {

        media = JSON.parse(Android.getMedia());

        grid.innerHTML = "";

        const fragment = document.createDocumentFragment();

        for (let i = 0; i < media.length; i++) {

            const item = media[i];

            const tile = document.createElement("div");
            tile.className = "tile";

            const img = document.createElement("img");
            img.src = item.thumbnail;
            img.loading = "lazy";
            img.decoding = "async";
            tile.appendChild(img);

            // Small play badge in the GRID only.
            // Delete this block if you don't want it there either.
            if (item.type === "video") {
                const marker = document.createElement("div");
                marker.className = "video-marker";
                tile.appendChild(marker);
            }

            tile.addEventListener("click", function () {
                openViewer(i);
            });

            fragment.appendChild(tile);
        }

        grid.appendChild(fragment);
    }


    /* -------------------------
       VIEWER: panes
    ------------------------- */

    let panes = [];          // [previous, current, next] DOM elements
    let animating = false;

    function viewerHeight() {
        return viewer.clientHeight || window.innerHeight;
    }

    const TRANSPARENT_POSTER =
        "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

    function makePane(index) {

        const pane = document.createElement("div");
        pane.className = "pane";
        pane.style.height = viewerHeight() + "px";

        if (index < 0 || index >= media.length) {
            return pane;            // empty pane at the ends
        }

        const item = media[index];

        // Images use the full image. Videos use the thumbnail until
        // they become the current item (so nothing heavy is decoded
        // for neighbours).
        const img = document.createElement("img");
        img.src = item.type === "video" ? item.thumbnail : item.uri;
        img.decoding = "async";
        img.draggable = false;
        pane.appendChild(img);

        // Videos: a real <video> is created right away (paused), so its
        // true first frame is already decoded before you swipe to it.
        // It stays invisible until that frame exists, so the native
        // placeholder icon can never show.
        if (item.type === "video") {

            const video = document.createElement("video");

            video.setAttribute("playsinline", "");
            video.setAttribute("webkit-playsinline", "");
            video.setAttribute("disablepictureinpicture", "");
            video.setAttribute("controlslist", "nodownload nofullscreen noremoteplayback");
            video.controls = false;
            video.loop = true;
            video.preload = "auto";

            // A video WITHOUT a poster makes Android WebView draw its
            // default play-icon placeholder. A fully transparent poster
            // suppresses that icon, and lets the thumbnail <img> under
            // the video show through until the real frame is ready.
            video.setAttribute("poster", TRANSPARENT_POSTER);

            video.src = item.uri;

            pane.appendChild(video);
        }

        return pane;
    }

    function setOffset(dy, animate) {

        track.style.transition = animate
            ? "transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1)"
            : "none";

        track.style.transform =
            "translateY(" + (-viewerHeight() + dy) + "px)";
    }

    /*
     * Fully remove a pane's video from the DOM (never leave a
     * src-less <video> visible, that is what shows the placeholder).
     */
    function disposePane(pane) {

        if (!pane) {
            return;
        }

        const v = pane.querySelector("video");

        if (v) {
            v.pause();
            v.removeAttribute("src");
            v.load();
            v.remove();
        }
    }

    function disposeAll() {

        panes.forEach(disposePane);
    }

    /*
     * Rebuild all three panes around `current`.
     */
    function render() {

        disposeAll();

        track.innerHTML = "";

        panes = [current - 1, current, current + 1].map(makePane);

        panes.forEach(function (p) {
            track.appendChild(p);
        });

        track.style.height = (viewerHeight() * 3) + "px";

        setOffset(0, false);

        activateCurrent();
    }

    /*
     * The current pane's video already exists (and already shows
     * its first frame), so we only have to start it.
     */
    function activateCurrent() {

        const video = panes[1] && panes[1].querySelector("video");

        if (!video) {
            return;
        }

        video.play().catch(function () {});
    }


    /* -------------------------
       OPEN / CLOSE
    ------------------------- */

    function openViewer(index) {

        if (index < 0 || index >= media.length) {
            return;
        }

        gridScroll = grid.scrollTop;
        current = index;

        viewer.classList.add("visible");

        render();
    }

    function closeViewer() {

        disposeAll();

        viewer.classList.remove("visible");
        track.innerHTML = "";

        grid.scrollTop = gridScroll;

        revealCurrentTile();
    }

    /*
     * After closing, make sure the tile of the item you were last
     * viewing is on screen (you may have swiped far from where you
     * opened it). If it's already visible, the scroll position is
     * left alone.
     */
    function revealCurrentTile() {

        const tile = grid.children[current];

        if (!tile) {
            return;
        }

        const g = grid.getBoundingClientRect();
        const t = tile.getBoundingClientRect();

        const bottomPad = parseFloat(
            getComputedStyle(grid).paddingBottom
        ) || 0;

        const visibleTop = g.top;
        const visibleBottom = g.bottom - bottomPad;

        if (t.top >= visibleTop && t.bottom <= visibleBottom) {
            return;
        }

        // Centre the tile vertically
        grid.scrollTop +=
            (t.top + t.height / 2) -
            (visibleTop + (visibleBottom - visibleTop) / 2);
    }

    /*
     * Status bar / navigation bar heights in CSS px.
     * Called from Android whenever they change (rotation etc.).
     */
    function setInsets(top, bottom) {

        const root = document.documentElement.style;

        root.setProperty("--top-inset", top + "px");
        root.setProperty("--bottom-inset", bottom + "px");
    }

    function handleAndroidBack() {

        if (viewer.classList.contains("visible")) {
            closeViewer();
            return true;
        }

        return false;
    }


    /* -------------------------
       SWIPING (finger-following)
    ------------------------- */

    let startY = 0;
    let startX = 0;
    let startTime = 0;
    let dragging = false;
    let moved = false;
    let dy = 0;

    viewer.addEventListener("touchstart", function (e) {

        if (animating || e.touches.length !== 1) {
            return;
        }

        dragging = true;
        moved = false;
        dy = 0;

        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        startTime = Date.now();

        track.style.transition = "none";

    }, { passive: true });


    viewer.addEventListener("touchmove", function (e) {

        if (!dragging) {
            return;
        }

        e.preventDefault();

        dy = e.touches[0].clientY - startY;

        if (Math.abs(dy) > 8) {
            moved = true;
        }

        // Rubber-band at the first / last item
        const atStart = current === 0 && dy > 0;
        const atEnd = current === media.length - 1 && dy < 0;

        if (atStart || atEnd) {
            dy = dy * 0.3;
        }

        setOffset(dy, false);

    }, { passive: false });


    viewer.addEventListener("touchend", function () {

        if (!dragging) {
            return;
        }

        dragging = false;

        // Tap (no real movement): play / pause video
        if (!moved) {

            const video = panes[1] && panes[1].querySelector("video");

            if (video) {
                if (video.paused) {
                    video.play().catch(function () {});
                } else {
                    video.pause();
                }
            }

            setOffset(0, false);
            return;
        }

        const h = viewerHeight();
        const elapsed = Math.max(Date.now() - startTime, 1);
        const velocity = dy / elapsed;            // px per ms

        const farEnough = Math.abs(dy) > h * 0.25;
        const fastFlick = Math.abs(velocity) > 0.5 && Math.abs(dy) > 30;

        if (farEnough || fastFlick) {

            if (dy < 0 && current < media.length - 1) {
                commit(1);
                return;
            }

            if (dy > 0 && current > 0) {
                commit(-1);
                return;
            }
        }

        // Not enough: snap back
        setOffset(0, true);

    }, { passive: true });


    viewer.addEventListener("touchcancel", function () {

        dragging = false;
        setOffset(0, true);

    }, { passive: true });


    /*
     * Finish the swipe: animate the track the rest of the way,
     * then re-centre on the new item.
     */
    function commit(direction) {

        animating = true;

        const video = panes[1] && panes[1].querySelector("video");

        if (video) {
            video.pause();
        }

        setOffset(-direction * viewerHeight(), true);

        setTimeout(function () {

            // The pane we just left becomes a neighbour: rewind its
            // video so it shows frame 0 again (it is off-screen now).
            const left = panes[1].querySelector("video");

            if (left) {
                left.pause();
                left.currentTime = 0;
            }

            current += direction;

            // Reuse the pane that's already on screen; only create
            // the one new neighbour that scrolled into range.
            if (direction === 1) {
                disposePane(panes[0]);
                track.removeChild(panes[0]);
                panes.shift();
                panes.push(makePane(current + 1));
                track.appendChild(panes[2]);
            } else {
                disposePane(panes[2]);
                track.removeChild(panes[2]);
                panes.pop();
                panes.unshift(makePane(current - 1));
                track.insertBefore(panes[0], track.firstChild);
            }

            setOffset(0, false);

            activateCurrent();

            animating = false;

        }, 250);
    }


    window.addEventListener("resize", function () {

        if (viewer.classList.contains("visible")) {
            render();
        }
    });


    /* -------------------------
       START
    ------------------------- */

    // Ask Android for the current insets before first paint
    try {
        const insets = JSON.parse(Android.getInsets());
        setInsets(insets.top, insets.bottom);
    } catch (e) {}

    loadMedia();

</script>

</body>

</html>
