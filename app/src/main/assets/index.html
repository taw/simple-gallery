<!DOCTYPE html>
<html>

<head>

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family: sans-serif;

            overscroll-behavior: none;
        }


        /* -------------------------
           GRID
        ------------------------- */

#grid {
    position: fixed;

    left: 0;
    right: 0;

    top: env(safe-area-inset-top, 0px);
    bottom: 0;

    overflow-y: auto;
    overflow-x: hidden;

    display: grid;

    grid-template-columns: repeat(3, minmax(0, 1fr));

    grid-auto-rows:
        calc((100vw - 4px) / 3);

    gap: 2px;

    background: #000;

    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
}

.tile {

    position: relative;

    /*
     * Don't use aspect-ratio here.
     * The grid itself controls the height.
     */
    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    background: #111;
}

        .tile img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            background: #111;
        }


        /*
         * Little video indicator.
         * It doesn't require decoding the video.
         */

        .video-marker {

            position: absolute;

            right: 7px;
            bottom: 7px;

            width: 25px;
            height: 25px;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;
        }


        .video-marker::after {

            content: "";

            margin-left: 2px;

            width: 0;
            height: 0;

            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 9px solid white;
        }


        /* -------------------------
           VIEWER
        ------------------------- */

        #viewer {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 100;
        }


        #viewer.visible {
            display: flex;
        }


        #viewer img,
        #viewer video {

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            background: #000;
        }


        /* -------------------------
           SWIPE ANIMATION
        ------------------------- */

        .slide-next {

            animation:
                slide-next 180ms ease-out;
        }


        .slide-previous {

            animation:
                slide-previous 180ms ease-out;
        }


        @keyframes slide-next {

            from {
                transform: translateY(45px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }


        @keyframes slide-previous {

            from {
                transform: translateY(-45px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

    </style>

</head>


<body>


<div id="grid"></div>


<div id="viewer">

    <img id="viewerImage">

    <video
            id="viewerVideo"
            playsinline
            preload="metadata"
            autoplay>
    </video>

</div>


<script>


    let media = [];

    let current = 0;

    let gridScroll = 0;


    /* -------------------------
       Elements
    ------------------------- */

    const grid =
        document.getElementById("grid");

    const viewer =
        document.getElementById("viewer");

    const viewerImage =
        document.getElementById("viewerImage");

    const viewerVideo =
        document.getElementById("viewerVideo");


    /* -------------------------
       GRID
    ------------------------- */

    function loadMedia() {

        media =
            JSON.parse(
                Android.getMedia()
            );

        grid.innerHTML = "";

        const fragment =
            document.createDocumentFragment();


        for (
            let i = 0;
            i < media.length;
            i++
        ) {

            const item = media[i];


            const tile =
                document.createElement("div");

            tile.className = "tile";


            /*
             * IMPORTANT:
             *
             * The grid does NOT load the original
             * image/video.
             *
             * It asks Android for a small thumbnail.
             */

            const img =
                document.createElement("img");

            img.src =
                item.thumbnail;

            img.loading = "lazy";

            img.decoding = "async";


            tile.appendChild(img);


            /*
             * Videos get a simple visual marker.
             */

            if (item.type === "video") {

                const marker =
                    document.createElement("div");

                marker.className =
                    "video-marker";

                tile.appendChild(marker);
            }


            tile.addEventListener(
                "click",
                function() {

                    openViewer(i);
                }
            );


            fragment.appendChild(tile);
        }


        grid.appendChild(fragment);
    }


    /* -------------------------
       OPEN VIEWER
    ------------------------- */

    function openViewer(index) {

        if (
            index < 0 ||
            index >= media.length
        ) {
            return;
        }


        gridScroll =
            grid.scrollTop;

        current =
            index;


        showCurrent(null);


        viewer.classList.add(
            "visible"
        );
    }


    /* -------------------------
       SHOW MEDIA
    ------------------------- */

    function showCurrent(direction) {

        const item =
            media[current];


        viewerVideo.pause();

        viewerVideo.removeAttribute(
            "src"
        );

        viewerVideo.load();


        viewerImage.removeAttribute(
            "src"
        );


        viewerImage.style.display =
            "none";

        viewerVideo.style.display =
            "none";


        const element =
            item.type === "video"
                ? viewerVideo
                : viewerImage;


        element.classList.remove(
            "slide-next",
            "slide-previous"
        );


        /*
         * Force the browser to notice the
         * class removal before adding it again.
         */

        void element.offsetWidth;


        if (item.type === "video") {

            viewerVideo.style.display =
                "block";

            viewerVideo.src =
                item.uri;

            viewerVideo.currentTime =
                0;

            if (direction) {

                viewerVideo.classList.add(
                    direction === "next"
                        ? "slide-next"
                        : "slide-previous"
                );
            }


            viewerVideo.play()
                .catch(function() {

                    /*
                     * Autoplay may be blocked by
                     * Android/WebView. User can
                     * tap the video to start it.
                     */
                });


        } else {

            viewerImage.style.display =
                "block";

            viewerImage.src =
                item.uri;


            if (direction) {

                viewerImage.classList.add(
                    direction === "next"
                        ? "slide-next"
                        : "slide-previous"
                );
            }
        }
    }


    /* -------------------------
       NEXT / PREVIOUS
    ------------------------- */

    function next() {

        if (
            current <
            media.length - 1
        ) {

            current++;

            showCurrent("next");
        }
    }


    function previous() {

        if (current > 0) {

            current--;

            showCurrent("previous");
        }
    }


    /* -------------------------
       CLOSE
    ------------------------- */

    function closeViewer() {

        viewerVideo.pause();

        viewerVideo.removeAttribute(
            "src"
        );

        viewerVideo.load();

        viewer.classList.remove(
            "visible"
        );


        /*
         * Restore exact grid position.
         */

        grid.scrollTop =
            gridScroll;
    }


    /* -------------------------
       ANDROID BACK
    ------------------------- */

    function handleAndroidBack() {

        if (
            viewer.classList.contains(
                "visible"
            )
        ) {

            closeViewer();

            return true;
        }


        return false;
    }


    /* -------------------------
       SWIPING
    ------------------------- */

    let touchStartY = 0;
    let touchStartX = 0;


    viewer.addEventListener(
        "touchstart",
        function(e) {

            touchStartY =
                e.touches[0].clientY;

            touchStartX =
                e.touches[0].clientX;

        },
        {
            passive: true
        }
    );


    viewer.addEventListener(
        "touchend",
        function(e) {

            const endY =
                e.changedTouches[0].clientY;

            const endX =
                e.changedTouches[0].clientX;


            const deltaY =
                endY - touchStartY;

            const deltaX =
                endX - touchStartX;


            /*
             * Don't treat horizontal movement
             * as a vertical swipe.
             */

            if (
                Math.abs(deltaX) >
                Math.abs(deltaY)
            ) {
                return;
            }


            if (
                Math.abs(deltaY) < 50
            ) {
                return;
            }


            if (deltaY < 0) {

                next();

            } else {

                previous();
            }

        },
        {
            passive: true
        }
    );


    /* -------------------------
       START
    ------------------------- */

    loadMedia();


</script>

</body>

</html>
