<!DOCTYPE html>
<html>

<head>

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            overscroll-behavior: none;
        }

        /* -------------------------
           GRID
        ------------------------- */

        #grid {
            position: fixed;
            left: 0;
            right: 0;
            top: env(safe-area-inset-top, 0px);
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-auto-rows: calc((100vw - 4px) / 3);
            gap: 2px;
            background: #000;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .tile {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #111;
        }

        .tile img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #111;
        }

        .video-marker {
            position: absolute;
            right: 7px;
            bottom: 7px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .video-marker::after {
            content: "";
            margin-left: 2px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 9px solid white;
        }

        /* -------------------------
           VIEWER (TikTok-style pager)
        ------------------------- */

        #viewer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            overflow: hidden;
            z-index: 100;
            touch-action: none;
        }

        #viewer.visible {
            display: block;
        }

        /* Three stacked panes: previous, current, next */
        #track {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            will-change: transform;
        }

        .pane {
            width: 100%;
            height: 100vh;      /* overwritten in JS with the real viewer height */
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pane img,
        .pane video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Make sure no native play button / overlay ever shows */
        video::-webkit-media-controls,
        video::-webkit-media-controls-start-playback-button,
        video::-webkit-media-controls-overlay-play-button {
            display: none !important;
            -webkit-appearance: none;
        }

    </style>

</head>


<body>

<div id="grid"></div>

<div id="viewer">
    <div id="track"></div>
</div>


<script>

    let media = [];
    let current = 0;
    let gridScroll = 0;

    const grid = document.getElementById("grid");
    const viewer = document.getElementById("viewer");
    const track = document.getElementById("track");


    /* -------------------------
       GRID
    ------------------------- */

    function loadMedia() {

        media = JSON.parse(Android.getMedia());

        grid.innerHTML = "";

        const fragment = document.createDocumentFragment();

        for (let i = 0; i < media.length; i++) {

            const item = media[i];

            const tile = document.createElement("div");
            tile.className = "tile";

            const img = document.createElement("img");
            img.src = item.thumbnail;
            img.loading = "lazy";
            img.decoding = "async";
            tile.appendChild(img);

            // Small play badge in the GRID only.
            // Delete this block if you don't want it there either.
            if (item.type === "video") {
                const marker = document.createElement("div");
                marker.className = "video-marker";
                tile.appendChild(marker);
            }

            tile.addEventListener("click", function () {
                openViewer(i);
            });

            fragment.appendChild(tile);
        }

        grid.appendChild(fragment);
    }


    /* -------------------------
       VIEWER: panes
    ------------------------- */

    let panes = [];          // [previous, current, next] DOM elements
    let animating = false;

    function viewerHeight() {
        return viewer.clientHeight || window.innerHeight;
    }

    function makePane(index) {

        const pane = document.createElement("div");
        pane.className = "pane";
        pane.style.height = viewerHeight() + "px";

        if (index < 0 || index >= media.length) {
            return pane;            // empty pane at the ends
        }

        const item = media[index];

        // Images use the full image. Videos use the thumbnail until
        // they become the current item (so nothing heavy is decoded
        // for neighbours).
        const img = document.createElement("img");
        img.src = item.type === "video" ? item.thumbnail : item.uri;
        img.decoding = "async";
        img.draggable = false;
        pane.appendChild(img);

        return pane;
    }

    function setOffset(dy, animate) {

        track.style.transition = animate
            ? "transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1)"
            : "none";

        track.style.transform =
            "translateY(" + (-viewerHeight() + dy) + "px)";
    }

    function stopVideo() {

        const old = track.querySelector("video");

        if (old) {
            old.pause();
            old.removeAttribute("src");
            old.load();
        }
    }

    /*
     * Rebuild all three panes around `current`.
     */
    function render() {

        stopVideo();

        track.innerHTML = "";

        panes = [current - 1, current, current + 1].map(makePane);

        panes.forEach(function (p) {
            track.appendChild(p);
        });

        track.style.height = (viewerHeight() * 3) + "px";

        setOffset(0, false);

        activateCurrent();
    }

    /*
     * If the current item is a video, swap its thumbnail for a real
     * <video>. The thumbnail is used as the poster, so the native
     * "circle with triangle" placeholder never appears.
     */
    function activateCurrent() {

        const item = media[current];

        if (!item || item.type !== "video") {
            return;
        }

        const pane = panes[1];

        const video = document.createElement("video");

        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.setAttribute("poster", item.thumbnail);   // <-- hides default placeholder
        video.setAttribute("disablepictureinpicture", "");
        video.setAttribute("controlslist", "nodownload nofullscreen noremoteplayback");
        video.controls = false;
        video.loop = true;
        video.preload = "auto";
        video.src = item.uri;

        pane.innerHTML = "";
        pane.appendChild(video);

        video.play().catch(function () {});
    }


    /* -------------------------
       OPEN / CLOSE
    ------------------------- */

    function openViewer(index) {

        if (index < 0 || index >= media.length) {
            return;
        }

        gridScroll = grid.scrollTop;
        current = index;

        viewer.classList.add("visible");

        render();
    }

    function closeViewer() {

        stopVideo();

        viewer.classList.remove("visible");
        track.innerHTML = "";

        grid.scrollTop = gridScroll;
    }

    function handleAndroidBack() {

        if (viewer.classList.contains("visible")) {
            closeViewer();
            return true;
        }

        return false;
    }


    /* -------------------------
       SWIPING (finger-following)
    ------------------------- */

    let startY = 0;
    let startX = 0;
    let startTime = 0;
    let dragging = false;
    let moved = false;
    let dy = 0;

    viewer.addEventListener("touchstart", function (e) {

        if (animating || e.touches.length !== 1) {
            return;
        }

        dragging = true;
        moved = false;
        dy = 0;

        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        startTime = Date.now();

        track.style.transition = "none";

    }, { passive: true });


    viewer.addEventListener("touchmove", function (e) {

        if (!dragging) {
            return;
        }

        e.preventDefault();

        dy = e.touches[0].clientY - startY;

        if (Math.abs(dy) > 8) {
            moved = true;
        }

        // Rubber-band at the first / last item
        const atStart = current === 0 && dy > 0;
        const atEnd = current === media.length - 1 && dy < 0;

        if (atStart || atEnd) {
            dy = dy * 0.3;
        }

        setOffset(dy, false);

    }, { passive: false });


    viewer.addEventListener("touchend", function () {

        if (!dragging) {
            return;
        }

        dragging = false;

        // Tap (no real movement): play / pause video
        if (!moved) {

            const video = track.querySelector("video");

            if (video) {
                if (video.paused) {
                    video.play().catch(function () {});
                } else {
                    video.pause();
                }
            }

            setOffset(0, false);
            return;
        }

        const h = viewerHeight();
        const elapsed = Math.max(Date.now() - startTime, 1);
        const velocity = dy / elapsed;            // px per ms

        const farEnough = Math.abs(dy) > h * 0.25;
        const fastFlick = Math.abs(velocity) > 0.5 && Math.abs(dy) > 30;

        if (farEnough || fastFlick) {

            if (dy < 0 && current < media.length - 1) {
                commit(1);
                return;
            }

            if (dy > 0 && current > 0) {
                commit(-1);
                return;
            }
        }

        // Not enough: snap back
        setOffset(0, true);

    }, { passive: true });


    viewer.addEventListener("touchcancel", function () {

        dragging = false;
        setOffset(0, true);

    }, { passive: true });


    /*
     * Finish the swipe: animate the track the rest of the way,
     * then re-centre on the new item.
     */
    function commit(direction) {

        animating = true;

        const video = track.querySelector("video");

        if (video) {
            video.pause();
        }

        setOffset(-direction * viewerHeight(), true);

        setTimeout(function () {

            current += direction;
            render();
            animating = false;

        }, 250);
    }


    window.addEventListener("resize", function () {

        if (viewer.classList.contains("visible")) {
            render();
        }
    });


    /* -------------------------
       START
    ------------------------- */

    loadMedia();

</script>

</body>

</html>
